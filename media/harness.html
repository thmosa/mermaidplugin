<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview-harness</title>
<!-- Testsida: kör preview.js utanför VS Code. Servera projektroten och öppna /media/harness.html. -->
<link rel="stylesheet" href="preview.css">
</head>
<body>
<div id="toolbar">
  <button data-action="out">−</button>
  <button data-action="in">+</button>
  <button data-action="fit">Fit</button>
  <button data-action="width">Width</button>
  <button data-action="actual">100%</button>
  <button data-action="selection">Selection</button>
  <span class="sep"></span>
  <label for="layout">Layout</label>
  <select id="layout"><option value="">default</option><option>dagre</option><option>elk</option><option>elk.stress</option></select>
  <label for="look">Look</label>
  <select id="look"><option value="">default</option><option>neo</option><option>classic</option><option>handDrawn</option></select>
  <label for="theme">Theme</label>
  <select id="theme"><option>auto</option><option>default</option><option>dark</option><option>forest</option><option>neutral</option><option>base</option><option>neo</option><option>neo-dark</option><option>redux</option><option>redux-dark</option><option>redux-color</option><option>redux-dark-color</option></select>
  <span class="sep"></span>
  <button data-action="svg" title="Save the whole diagram as SVG">SVG</button>
  <button data-action="png" title="Save the whole diagram as PNG (2×)">PNG</button>
  <span id="zoom-level"></span>
</div>
<div id="stage"></div>
<pre id="error" hidden></pre>
<script src="../node_modules/mermaid/dist/mermaid.min.js"></script>
<script src="zoom.js"></script>
<script src="labels.js"></script>
<script src="export.js"></script>
<script src="preview.js"></script>
<script>
  window.__out = [];
  window.addEventListener('preview-out', e => window.__out.push(e.detail));
  fetch('../samples/demo.mmd').then(r => r.text()).then(text => window.postMessage({ type: 'render', text }, '*'));
</script>
</body>
</html>
