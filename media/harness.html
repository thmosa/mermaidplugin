<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview-harness</title>
<!-- Testsida: kör preview.js utanför VS Code. Servera projektroten och öppna /media/harness.html. -->
<link rel="stylesheet" href="preview.css">
</head>
<body>
<div id="toolbar">
  <button data-action="out">−</button>
  <button data-action="in">+</button>
  <button data-action="fit">Anpassa</button>
  <button data-action="width">Bredd</button>
  <button data-action="actual">100 %</button>
  <button data-action="selection">Markering</button>
  <span class="sep"></span>
  <label for="layout">Layout</label>
  <select id="layout"><option value="">standard</option><option>dagre</option><option>elk</option><option>elk.stress</option></select>
  <label for="look">Stil</label>
  <select id="look"><option value="">standard</option><option>neo</option><option>classic</option><option>handDrawn</option></select>
  <span id="zoom-level"></span>
</div>
<div id="stage"></div>
<pre id="error" hidden></pre>
<script src="../node_modules/mermaid/dist/mermaid.min.js"></script>
<script src="zoom.js"></script>
<script src="preview.js"></script>
<script>
  window.__out = [];
  window.addEventListener('preview-out', e => window.__out.push(e.detail));
  fetch('../samples/demo.mmd').then(r => r.text()).then(text => window.postMessage({ type: 'render', text }, '*'));
</script>
</body>
</html>
